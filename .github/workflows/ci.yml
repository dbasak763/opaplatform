name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, analytics, frontend]
    steps:
      - uses: actions/checkout@v4

      - if: matrix.component == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - if: matrix.component == 'backend'
        run: cd order-service && ./mvnw --batch-mode clean test

      - if: matrix.component == 'analytics'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt
      - if: matrix.component == 'analytics'
        run: |
          pip install -r analytics-service/requirements.txt
          PYTHONPATH=analytics-service pytest -q analytics-service/tests

      - if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: matrix.component == 'frontend'
        run: |
          cd frontend
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          CI=true node node_modules/react-scripts/bin/react-scripts.js build

  end-to-end:
    runs-on: ubuntu-latest
    needs: components
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: docker compose up --build --detach --wait --wait-timeout 600
      - name: Verify the complete event flow
        run: ./scripts/test-e2e.sh
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-logs
          path: compose.log
      - name: Stop services
        if: always()
        run: docker compose down --volumes
